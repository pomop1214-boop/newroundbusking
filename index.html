<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>N.ROUND 버스킹 선곡 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FFF8F2;
    --ink:#2B2420;
    --ink-soft:#6E645C;
    --coral:#FF6B54;
    --coral-dark:#E1503A;
    --mint:#2FBFAE;
    --mint-dark:#1B9A8B;
    --salmon:#FFC9B4;
    --muted:#BDB3AA;
    --muted-bg:#F1ECE7;
    --card:#FFFFFF;
    --line:#F0E1D4;
    --shadow: 0 6px 20px rgba(43,36,32,0.06);
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #FFEDE3 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #E7FAF6 0%, transparent 55%),
      var(--cream);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.5;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 80px; }
  [hidden]{ display:none !important; }

  header{ text-align:center; margin-bottom:28px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; letter-spacing:0.02em;
    color:var(--coral-dark); background:#FFF0EA; border:1px solid #FFD9CB;
    padding:6px 14px; border-radius:999px; margin-bottom:14px;
  }
  h1{
    font-family:'Gaegu', sans-serif; font-weight:700; font-size:32px;
    margin:0 0 8px; color:var(--ink); line-height:1.3;
  }
  h1 span{ color:var(--coral); }
  .sub{ font-size:14.5px; color:var(--ink-soft); margin:0; }

  .name-field{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .name-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .name-field input{
    width:100%; border:none; outline:none; font-size:17px; font-weight:700;
    font-family:'Pretendard', sans-serif; color:var(--ink); background:transparent;
  }
  .name-field input::placeholder{ color:#CFC5BC; font-weight:500; }

  .list-label{ display:flex; align-items:baseline; justify-content:space-between; margin:0 4px 10px; }
  .list-label b{ font-size:15px; }
  .list-label span{ font-size:12.5px; color:var(--ink-soft); }

  .song-row{
    display:flex; background:var(--card); border:1px solid var(--line); border-radius:16px;
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden; position:relative;
    animation: rowIn .35s ease both;
  }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .row-main{ flex:1; min-width:0; padding:14px 14px; display:flex; flex-direction:column; gap:8px; }
  .row-index{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:13px; color:var(--coral-dark); margin-bottom:-2px; }
  .row-main input{ width:100%; border:none; outline:none; background:transparent; font-family:'Pretendard', sans-serif; color:var(--ink); }
  .row-main input.title{ font-size:16px; font-weight:700; }
  .row-main input.artist{ font-size:13.5px; color:var(--ink-soft); font-weight:500; }
  .row-main input::placeholder{ color:#D8CEC5; }

  .remove-btn{
    align-self:flex-start; margin-top:2px; font-size:11.5px; color:var(--muted);
    background:none; border:none; padding:0; cursor:pointer; text-decoration:underline;
  }
  .remove-btn:hover{ color:var(--coral-dark); }

  .stub{
    width:104px; flex-shrink:0; position:relative; border-left:2px dashed #E7D9CB;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:10px 8px; text-align:center; background:#FFFDFB;
  }
  .stub::before, .stub::after{
    content:""; position:absolute; left:-9px; width:18px; height:18px; border-radius:50%;
    background:var(--cream); border:1px solid var(--line);
  }
  .stub::before{ top:-9px; } .stub::after{ bottom:-9px; }

  .eq{ display:flex; align-items:flex-end; gap:3px; height:26px; }
  .eq i{ display:block; width:5px; border-radius:3px; background:var(--muted); height:6px; transition: height .35s ease, background .35s ease; }
  .stub.waiting .eq i{ background:#E3DAD1; }
  .stub.loading .eq i{ animation: bounce 0.9s ease-in-out infinite; background:var(--muted); }
  .stub.loading .eq i:nth-child(1){ animation-delay:0s; }
  .stub.loading .eq i:nth-child(2){ animation-delay:0.15s; }
  .stub.loading .eq i:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,100%{ height:6px; } 50%{ height:22px; } }

  .stub.level-상 .eq i{ background:var(--coral); }
  .stub.level-상 .eq i:nth-child(1){ height:16px; }
  .stub.level-상 .eq i:nth-child(2){ height:24px; }
  .stub.level-상 .eq i:nth-child(3){ height:20px; }
  .stub.level-중 .eq i{ background:var(--mint); }
  .stub.level-중 .eq i:nth-child(1){ height:10px; }
  .stub.level-중 .eq i:nth-child(2){ height:17px; }
  .stub.level-중 .eq i:nth-child(3){ height:12px; }
  .stub.level-하 .eq i{ background:var(--muted); }
  .stub.level-하 .eq i:nth-child(1){ height:6px; }
  .stub.level-하 .eq i:nth-child(2){ height:10px; }
  .stub.level-하 .eq i:nth-child(3){ height:7px; }

  .stub .label{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:15px; }
  .stub.level-상 .label{ color:var(--coral-dark); }
  .stub.level-중 .label{ color:var(--mint-dark); }
  .stub.level-하 .label{ color:#8A8078; }
  .stub .reason{ font-size:10.5px; color:var(--ink-soft); line-height:1.3; }
  .stub .placeholder{ font-size:11px; color:#C7BDB4; }
  .stub .retry{ font-size:10.5px; background:none; border:none; color:var(--coral-dark); text-decoration:underline; cursor:pointer; padding:0; }

  .add-btn{
    width:100%; padding:13px; border-radius:14px; border:1.5px dashed #E2B7A6; background:transparent;
    color:var(--coral-dark); font-weight:700; font-size:14.5px; cursor:pointer; margin:6px 0 24px;
  }
  .add-btn:hover{ background:#FFF3ED; }

  .summary{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .summary-title{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .summary-counts{ display:flex; gap:10px; margin-bottom:14px; }
  .count-chip{ flex:1; text-align:center; padding:10px 4px; border-radius:12px; background:var(--muted-bg); }
  .count-chip b{ display:block; font-family:'Gaegu', sans-serif; font-size:22px; }
  .count-chip span{ font-size:11px; color:var(--ink-soft); }
  .count-chip.상 b{ color:var(--coral-dark); }
  .count-chip.중 b{ color:var(--mint-dark); }
  .count-chip.하 b{ color:#8A8078; }

  .submit-btn{
    width:100%; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--coral), var(--coral-dark)); color:#fff;
    font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(255,107,84,0.28);
  }
  .submit-btn:disabled{ background:#E5DED7; box-shadow:none; color:#A79E95; cursor:not-allowed; }
  .hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:10px; }
  .error-msg{ text-align:center; font-size:12.5px; color:var(--coral-dark); margin-top:10px; }

  .done-card{
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 20px;
    text-align:center; box-shadow:var(--shadow);
  }
  .done-card .emoji{ font-size:38px; margin-bottom:10px; }
  .done-card h2{ font-family:'Gaegu', sans-serif; font-size:24px; margin:0 0 8px; }
  .done-card p{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  @media (prefers-reduced-motion: reduce){
    .song-row{ animation:none; }
    .stub.loading .eq i{ animation:none; }
  }
  @media (max-width:380px){ h1{ font-size:26px; } .stub{ width:88px; } }

  .admin-wrap{ max-width:720px; margin:0 auto; padding:28px 18px 80px; }
  .admin-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .admin-header h1{ font-size:22px; margin:0; }
  .admin-back{ font-size:13px; color:var(--ink-soft); text-decoration:none; }
  .pin-card{
    max-width:320px; margin:60px auto; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:24px; text-align:center; box-shadow:var(--shadow);
  }
  .pin-card input{
    width:100%; text-align:center; font-size:20px; letter-spacing:6px; padding:10px;
    border:1px solid var(--line); border-radius:10px; margin:14px 0; outline:none;
  }
  .pin-card button{
    width:100%; padding:11px; border:none; border-radius:10px; background:var(--coral-dark);
    color:#fff; font-weight:700; cursor:pointer;
  }
  .admin-summary{ display:flex; gap:10px; margin-bottom:18px; }
  .admin-chip{ flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 4px; }
  .admin-chip b{ display:block; font-family:'Gaegu', sans-serif; font-size:22px; }
  .sub-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    margin-bottom:10px; box-shadow:var(--shadow);
  }
  .sub-card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .sub-card-top b{ font-size:15px; }
  .sub-card-top span{ font-size:11px; color:var(--ink-soft); }
  .sub-song{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--muted-bg); font-size:13px; }
  .sub-song:first-of-type{ border-top:none; }
  .sub-song-name{ flex:1; min-width:0; }
  .sub-song-name .artist{ color:var(--ink-soft); font-size:11.5px; }
  .sub-badge{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:13px; padding:2px 10px; border-radius:999px; flex-shrink:0; margin-left:8px; }
  .sub-badge.상{ background:#FFEAE4; color:var(--coral-dark); }
  .sub-badge.중{ background:#E3F7F4; color:var(--mint-dark); }
  .sub-badge.하{ background:var(--muted-bg); color:#8A8078; }
  .refresh-btn{
    display:block; margin:0 auto 16px; background:none; border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0; }
</style>
</head>
<body>

<div class="wrap" id="main-view">
  <header>
    <div class="eyebrow">🎤 N.ROUND 버스킹 선곡 신청</div>
    <h1>우리 무대에 오를<br><span>곡</span>을 골라주세요</h1>
    <p class="sub">곡 제목을 적으면, 유튜브 조회수를 기반으로 대중성을 상 · 중 · 하로 자동 판단해드려요</p>
  </header>

  <div class="name-field">
    <label for="participant-name">신청자 이름</label>
    <input id="participant-name" type="text" placeholder="이름을 입력해주세요" />
  </div>

  <div class="list-label">
    <b>선곡 리스트</b>
    <span id="row-count-label">최소 2곡</span>
  </div>

  <div id="song-list"></div>

  <button class="add-btn" id="add-row-btn" type="button">+ 곡 추가하기</button>

  <div class="summary" id="summary-card">
    <div class="summary-title">대중성 분석 결과</div>
    <div class="summary-counts">
      <div class="count-chip 상"><b id="count-상">0</b><span>상</span></div>
      <div class="count-chip 중"><b id="count-중">0</b><span>중</span></div>
      <div class="count-chip 하"><b id="count-하">0</b><span>하</span></div>
    </div>
    <button class="submit-btn" id="submit-btn" disabled type="button">이름 · 곡 2개 이상 입력하면 제출할 수 있어요</button>
    <p class="error-msg" id="error-msg" hidden></p>
    <p class="hint">제출하면 바로 운영진에게 전달돼요. 따로 카톡 보내지 않아도 돼요 🙌</p>
  </div>

  <div class="done-card" id="done-card" hidden>
    <div class="emoji">🎉</div>
    <h2>제출 완료!</h2>
    <p>선곡 신청이 저장됐어요. 무대에서 만나요!</p>
  </div>

  <div style="text-align:center; margin-top:24px;">
    <a href="#admin" style="font-size:12px; color:var(--ink-soft); text-decoration:underline;">관리자 페이지</a>
  </div>
</div>

<div class="admin-wrap" id="admin-view" hidden>
  <div class="admin-header">
    <h1>🎤 선곡 신청 관리</h1>
    <a href="#" class="admin-back" id="admin-back-link">← 신청 화면으로</a>
  </div>

  <div class="pin-card" id="pin-card">
    <div style="font-size:13px;color:var(--ink-soft);">관리자 PIN을 입력해주세요</div>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" />
    <button id="pin-submit" type="button">확인</button>
    <p class="error-msg" id="pin-error" hidden>PIN이 틀렸어요</p>
  </div>

  <div id="admin-content" hidden>
    <div class="admin-summary">
      <div class="admin-chip"><b id="admin-count-total">0</b><span style="font-size:11px;color:var(--ink-soft);">신청자</span></div>
      <div class="admin-chip"><b id="admin-count-상" style="color:var(--coral-dark);">0</b><span style="font-size:11px;color:var(--ink-soft);">상 곡수</span></div>
      <div class="admin-chip"><b id="admin-count-중" style="color:var(--mint-dark);">0</b><span style="font-size:11px;color:var(--ink-soft);">중 곡수</span></div>
      <div class="admin-chip"><b id="admin-count-하" style="color:#8A8078;">0</b><span style="font-size:11px;color:var(--ink-soft);">하 곡수</span></div>
    </div>
    <button class="refresh-btn" id="refresh-btn" type="button">🔄 새로고침</button>
    <div id="submissions-list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
const ADMIN_PIN = '1214';

const API_ENDPOINT = '/api/analyze';
const MIN_SONGS = 2;

let supabaseClient = null;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error('Supabase 초기화 실패', e);
}

const songListEl = document.getElementById('song-list');
const addRowBtn = document.getElementById('add-row-btn');
const nameInput = document.getElementById('participant-name');
const submitBtn = document.getElementById('submit-btn');
const rowCountLabel = document.getElementById('row-count-label');
const errorMsgEl = document.getElementById('error-msg');
const summaryCard = document.getElementById('summary-card');
const doneCard = document.getElementById('done-card');

let rows = [];
let rowSeq = 0;
let submitting = false;

function createRow(){
  const id = 'row-' + (++rowSeq);
  rows.push({ id, title:'', artist:'', level:null, reason:'', status:'idle' });
  renderRows();
}

function removeRow(id){
  if(rows.length <= MIN_SONGS) return;
  rows = rows.filter(r => r.id !== id);
  renderRows();
}

function renderRows(){
  songListEl.innerHTML = '';
  rows.forEach((row, idx) => {
    const el = document.createElement('div');
    el.className = 'song-row';
    el.innerHTML =
      '<div class="row-main">' +
        '<div class="row-index">' + (idx + 1) + '번째 곡</div>' +
        '<input class="title" type="text" placeholder="곡 제목" value="' + escapeHtml(row.title) + '" data-id="' + row.id + '" data-field="title" />' +
        '<input class="artist" type="text" placeholder="가수명 (선택)" value="' + escapeHtml(row.artist) + '" data-id="' + row.id + '" data-field="artist" />' +
        (rows.length > MIN_SONGS ? '<button class="remove-btn" data-remove="' + row.id + '" type="button">이 곡 삭제</button>' : '') +
      '</div>' +
      '<div class="stub ' + stubClass(row) + '" data-stub="' + row.id + '">' +
        renderStubInner(row) +
      '</div>';
    songListEl.appendChild(el);
  });

  rowCountLabel.textContent = rows.length + '곡 (최소 ' + MIN_SONGS + ')';

  songListEl.querySelectorAll('input').forEach(function(input){
    input.addEventListener('input', onFieldInput);
  });
  songListEl.querySelectorAll('input.title').forEach(function(input){
    input.addEventListener('blur', onTitleBlur);
  });
  songListEl.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.addEventListener('click', function(){ removeRow(btn.dataset.remove); });
  });
  songListEl.querySelectorAll('[data-retry]').forEach(function(btn){
    btn.addEventListener('click', function(){ analyzeRow(btn.dataset.retry); });
  });

  updateSummary();
}

function stubClass(row){
  if(row.status === 'loading') return 'loading';
  if(row.status === 'done' && row.level) return 'level-' + row.level;
  if(row.status === 'error') return '';
  return 'waiting';
}

function renderStubInner(row){
  const eq = '<div class="eq"><i></i><i></i><i></i></div>';
  if(row.status === 'loading'){
    return eq + '<span class="placeholder">분석 중…</span>';
  }
  if(row.status === 'done' && row.level){
    return eq + '<span class="label">' + row.level + '</span><span class="reason">' + escapeHtml(row.reason || '') + '</span>';
  }
  if(row.status === 'error'){
    return eq + '<span class="placeholder">분석 실패</span><button class="retry" data-retry="' + row.id + '" type="button">다시 시도</button>';
  }
  return eq + '<span class="placeholder">곡 제목 입력 시<br>자동 분석</span>';
}

function onFieldInput(e){
  const id = e.target.dataset.id;
  const field = e.target.dataset.field;
  const row = rows.find(function(r){ return r.id === id; });
  if(!row) return;
  row[field] = e.target.value;
  updateSummary();
}

function onTitleBlur(e){
  const id = e.target.dataset.id;
  const row = rows.find(function(r){ return r.id === id; });
  if(!row) return;
  if(row.title.trim() && row.status !== 'loading'){
    analyzeRow(id);
  }
}

async function analyzeRow(id){
  const row = rows.find(function(r){ return r.id === id; });
  if(!row) return;
  row.status = 'loading';
  updateStubOnly(row);

  try{
    const res = await fetch(API_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ title: row.title.trim(), artist: row.artist.trim() })
    });
    if(!res.ok) throw new Error('요청 실패');
    const data = await res.json();
    if(!data.level) throw new Error('형식 오류');
    row.level = data.level;
    row.reason = data.reason || '';
    row.status = 'done';
  }catch(err){
    row.status = 'error';
  }
  updateStubOnly(row);
  updateSummary();
}

function updateStubOnly(row){
  const stubEl = songListEl.querySelector('[data-stub="' + row.id + '"]');
  if(!stubEl) return;
  stubEl.className = 'stub ' + stubClass(row);
  stubEl.innerHTML = renderStubInner(row);
  const retryBtn = stubEl.querySelector('[data-retry]');
  if(retryBtn) retryBtn.addEventListener('click', function(){ analyzeRow(retryBtn.dataset.retry); });
}

function updateSummary(){
  const counts = { '상':0, '중':0, '하':0 };
  rows.forEach(function(r){ if(r.level) counts[r.level]++; });
  document.getElementById('count-상').textContent = counts['상'];
  document.getElementById('count-중').textContent = counts['중'];
  document.getElementById('count-하').textContent = counts['하'];

  const filledRows = rows.filter(function(r){ return r.title.trim(); });
  const ready = nameInput.value.trim() && filledRows.length >= MIN_SONGS;

  if(!submitting){
    submitBtn.disabled = !ready;
    submitBtn.textContent = ready
      ? '제출하기 🎤'
      : '이름 · 곡 ' + MIN_SONGS + '개 이상 입력하면 제출할 수 있어요';
  }
}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, function(s){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[s];
  });
}

addRowBtn.addEventListener('click', createRow);
nameInput.addEventListener('input', updateSummary);

submitBtn.addEventListener('click', async function(){
  if(submitBtn.disabled || submitting) return;
  if(!supabaseClient){
    showError('저장소 연결에 문제가 있어요. 잠시 후 다시 시도해주세요.');
    return;
  }

  submitting = true;
  errorMsgEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = '제출 중…';

  const payload = {
    name: nameInput.value.trim(),
    songs: rows
      .filter(function(r){ return r.title.trim(); })
      .map(function(r){
        return {
          title: r.title.trim(),
          artist: r.artist.trim(),
          level: r.level,
          reason: r.reason
        };
      })
  };

  try{
    const result = await supabaseClient.from('busking_submissions').insert(payload);
    if(result.error) throw result.error;
    summaryCard.hidden = true;
    document.getElementById('song-list').hidden = true;
    addRowBtn.hidden = true;
    document.querySelector('.name-field').hidden = true;
    document.querySelector('.list-label').hidden = true;
    doneCard.hidden = false;
  }catch(err){
    submitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '제출하기 🎤';
    showError('제출에 실패했어요. 잠시 후 다시 시도해주세요.');
  }
});

function showError(msg){
  errorMsgEl.textContent = msg;
  errorMsgEl.hidden = false;
}

for(let i = 0; i < MIN_SONGS; i++) createRow();

const mainView = document.getElementById('main-view');
const adminView = document.getElementById('admin-view');
const pinCard = document.getElementById('pin-card');
const pinInput = document.getElementById('pin-input');
const pinSubmit = document.getElementById('pin-submit');
const pinError = document.getElementById('pin-error');
const adminContent = document.getElementById('admin-content');
const submissionsListEl = document.getElementById('submissions-list');
const refreshBtn = document.getElementById('refresh-btn');
const adminBackLink = document.getElementById('admin-back-link');

function isAdminRoute(){ return location.hash === '#admin'; }

function renderRoute(){
  if(isAdminRoute()){
    mainView.hidden = true;
    adminView.hidden = false;
  } else {
    mainView.hidden = false;
    adminView.hidden = true;
  }
}

window.addEventListener('hashchange', renderRoute);
renderRoute();

adminBackLink.addEventListener('click', function(e){
  e.preventDefault();
  location.hash = '';
});

pinSubmit.addEventListener('click', checkPin);
pinInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') checkPin(); });

function checkPin(){
  if(pinInput.value === ADMIN_PIN){
    pinCard.hidden = true;
    adminContent.hidden = false;
    loadSubmissions();
  } else {
    pinError.hidden = false;
  }
}

refreshBtn.addEventListener('click', loadSubmissions);

async function loadSubmissions(){
  if(!supabaseClient) return;
  submissionsListEl.innerHTML = '<div class="empty-note">불러오는 중…</div>';

  const result = await supabaseClient
    .from('busking_submissions')
    .select('*')
    .order('created_at', { ascending: false });

  if(result.error){
    submissionsListEl.innerHTML = '<div class="empty-note">불러오기 실패했어요</div>';
    return;
  }

  renderSubmissions(result.data || []);
}

function renderSubmissions(list){
  const counts = { '상':0, '중':0, '하':0 };
  list.forEach(function(sub){
    (sub.songs || []).forEach(function(s){ if(s.level) counts[s.level]++; });
  });
  document.getElementById('admin-count-total').textContent = list.length;
  document.getElementById('admin-count-상').textContent = counts['상'];
  document.getElementById('admin-count-중').textContent = counts['중'];
  document.getElementById('admin-count-하').textContent = counts['하'];

  if(list.length === 0){
    submissionsListEl.innerHTML = '<div class="empty-note">아직 제출된 신청이 없어요</div>';
    return;
  }

  submissionsListEl.innerHTML = list.map(function(sub){
    const time = sub.created_at ? new Date(sub.created_at).toLocaleString('ko-KR') : '';
    const songsHtml = (sub.songs || []).map(function(s){
      const badge = s.level ? '<div class="sub-badge ' + s.level + '">' + s.level + '</div>' : '<div class="sub-badge 하">-</div>';
      const artistHtml = s.artist ? ' <span class="artist">- ' + escapeHtml(s.artist) + '</span>' : '';
      return '<div class="sub-song"><div class="sub-song-name">' + escapeHtml(s.title) + artistHtml + '</div>' + badge + '</div>';
    }).join('');
    return '<div class="sub-card"><div class="sub-card-top"><b>' + escapeHtml(sub.name) + '</b><span>' + time + '</span></div>' + songsHtml + '</div>';
  }).join('');
}
</script>
</body>
